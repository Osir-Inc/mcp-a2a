group 'com.osir.mcp'
version '2.4.0'

subprojects {
    apply plugin: 'java'

    group 'com.osir.mcp'
    // One place to bump: the root version. A per-module literal here silently kept the module jars
    // on an old number, and every bump left the previously-named jar behind in build/quarkus-app/app,
    // which the Dockerfile copies wholesale into the image.
    version rootProject.version

    repositories {
        mavenCentral()
        mavenLocal()
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    compileJava {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }

    compileTestJava {
        options.encoding = 'UTF-8'
    }
}
